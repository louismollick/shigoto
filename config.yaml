# shigoto config. Secrets/paths come from env: GOOGLE_APPLICATION_CREDENTIALS, SHIGOTO_SPREADSHEET_ID, SHIGOTO_DB.

interval_hours: 6
liveness_max_per_run: 40  # per-posting closure checks per run; Indeed batch checks are free
max_posting_age_days: 180  # hide older dated postings; keep undated jobs; null disables the limit

# Runs after a successful Sheet sync. Authenticate Codex once in its persistent CODEX_HOME.
review:
  enabled: true
  max_per_run: 120
  model: gpt-6.1-sol
  reasoning_effort: low
  timeout_seconds: 180

search_terms:
  - microbiology
  - laboratory technician
  - laboratory analyst
  - quality assurance
  - quality control
  - food safety
  - food science
  - food testing
  - environmental laboratory
  - molecular biology
  - QA technician
  - QC technician
  - quality technician
  - lab technician
  - HACCP
  - SQF
  - QC analyst
  - microbiologist
  - food technologist
  - GMP
  - laboratory assistant
  - quality associate
  - dairy
  - environmental monitoring
  - FSQA
  - food safety technician
  - media preparation
  - Mandarin
  - laboratory
  - quality control inspector
  - chemist
  - scientist I

# Aliases are suburbs/boroughs that count as the city for sources that search nationwide.
cities:
  - name: Calgary
    jobspy_location: Calgary, AB
    aliases: [Airdrie, Okotoks, Chestermere, Cochrane, Strathmore, High River, Rocky View County]
  - name: Toronto
    jobspy_location: Toronto, ON
    aliases: [Mississauga, Brampton, Markham, Vaughan, Richmond Hill, Etobicoke, Scarborough, North York,
              Oakville, Concord, Woodbridge, Pickering, Ajax, Milton, Bolton, Newmarket, Aurora, Burlington,
              Hamilton, Stoney Creek, Ancaster, Oshawa, Whitby, Georgetown, Halton Hills, Stouffville,
              Whitchurch-Stouffville, Caledon, Thornhill, King City, Bowmanville, Bradford, Bradford West Gwillimbury]
  - name: Vancouver
    jobspy_location: Vancouver, BC
    aliases: [Burnaby, Surrey, Richmond, Coquitlam, Port Coquitlam, New Westminster, Delta, North Vancouver,
              Langley, Abbotsford, Maple Ridge, Pitt Meadows, White Rock, Port Moody, Cloverdale, Mission]
  - name: Ottawa
    jobspy_location: Ottawa, ON
    aliases: [Kanata, Nepean, Orleans, Gloucester, Stittsville, Carleton Place, Kemptville, Arnprior, Rockland]

# Recency widens after a missed/failed pass. Missing checkpoints trigger a full sweep.
# LinkedIn rotates focused OR groups, one group across all cities per run, 90s apart; the first
# city rotates too. LinkedIn and ZipRecruiter block datacenter IPs, so they use SHIGOTO_PROXY when set.
# Indeed searches every term x city, with a weekly full sweep to catch indexing lag.
jobspy:
  - site: indeed
    results_wanted: 100
    hours_old: 168
    full_sweep_days: 7
    full_sweep_results_wanted: 400
    delay_seconds: 2
  - site: linkedin
    query_groups:
      - [food safety, quality assurance technician, QA technician, QC technician, quality technician,
         quality control technician, FSQA, HACCP, SQF, food technologist]
      - [microbiology, microbiologist, laboratory technician, lab technician, laboratory analyst,
         laboratory assistant, media preparation]
      - [QC analyst, quality control analyst, chemistry technician, analytical chemist,
         environmental laboratory, environmental monitoring, quality associate]
    rotate_groups: true
    use_proxy: true
    results_wanted: 50
    full_sweep_results_wanted: 50
    hours_old: 72
    delay_seconds: 90
  # Small per-term caps limit pagination; delays between searches reduce blocking risk.
  - site: zip_recruiter
    use_proxy: true
    results_wanted: 20
    full_sweep_results_wanted: 20
    hours_old: 168
    delay_seconds: 10
  # Off by default: per-term searches, no descriptions, blocks after ~30 requests, mostly duplicates Indeed.
  - site: glassdoor
    enabled: false
    results_wanted: 30
    full_sweep_results_wanted: 30
    hours_old: 24
    delay_seconds: 30

jobbank_enabled: true
gcjobs_enabled: true

descriptions:
  linkedin_max_per_run: 25
  linkedin_delay_seconds: 10
  jobbank_max_per_run: 60

# Every job's title must contain one of these (case/accent-insensitive, whole word; trailing * = prefix).
# This is the main relevance filter: Indeed and Workday also match descriptions, so "food safety"
# otherwise pulls in every line cook with a food-handler certificate. Bare environmental, scientist,
# technologist, sanitation and regulatory titles were dropped: Codex rejected nearly all of them.
title_keywords: [microbiolog*, laborator*, lab, quality, QA, QC, FSQA, HACCP, food safety, food scien*,
                 food technolog*, food quality, food testing, molecular, environmental monitoring, analytical,
                 research*, chemist*, biochem*, biolog*, biotech*, sample, samples, HPLC, assay*,
                 stability, validation, product develop*, R&D,
                 in vivo, OOS, GC, GCMS*, LCMS*, ICP*, spectro*, chromatograph*, SQF,
                 analyst*, assurance, sterility, QMS, testing, GMP, bioanalytic*, chemical technologist*,
                 food inspector*, food inspection, preparation technician, diet technician,
                 baking technolog*, regulatory affairs coordinator, sanitation facilities coordinator]

# Then dropped if the title contains any of these (same matching rules). Seniority and part-time
# titles are never a fit for her.
exclude_title_keywords: [software, SDET, tester, game, games, QA automation, test automation, web developer,
                         full stack, frontend, backend, devops, dental, IT, bilingue, French,
                         senior, sr, manager, director, supervisor, principal, engineer*, engineering,
                         student, co-op, intern, internship, casual, part time, part-time]

# Jobs from these employers are hidden (same matching rules, against the company name).
exclude_companies: []

