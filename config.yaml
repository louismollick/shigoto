# shigoto config. Secrets/paths come from env: GOOGLE_APPLICATION_CREDENTIALS, SHIGOTO_SPREADSHEET_ID, SHIGOTO_DB.

interval_hours: 6
liveness_max_per_run: 40  # per-posting closure checks per run; Indeed batch checks are free

search_terms:
  - microbiology
  - laboratory technician
  - laboratory analyst
  - quality assurance
  - quality control
  - food safety
  - food science
  - food testing
  - environmental laboratory
  - molecular biology
  - QA technician
  - QC technician
  - quality technician
  - lab technician
  - HACCP
  - SQF
  - QC analyst
  - microbiologist
  - food technologist
  - GMP
  - sanitation technician
  - laboratory assistant
  - quality associate

# Aliases are suburbs/boroughs that count as the city for sources that search nationwide.
cities:
  - name: Calgary
    jobspy_location: Calgary, AB
    aliases: [Airdrie, Okotoks, Chestermere, Cochrane]
  - name: Toronto
    jobspy_location: Toronto, ON
    aliases: [Mississauga, Brampton, Markham, Vaughan, Richmond Hill, Etobicoke, Scarborough, North York,
              Oakville, Concord, Woodbridge, Pickering, Ajax, Milton, Bolton, Newmarket, Aurora, Burlington]
  - name: Vancouver
    jobspy_location: Vancouver, BC
    aliases: [Burnaby, Surrey, Richmond, Coquitlam, Port Coquitlam, New Westminster, Delta, North Vancouver,
              Langley, Abbotsford]
  - name: Ottawa
    jobspy_location: Ottawa, ON
    aliases: [Kanata, Nepean, Orleans, Gloucester]

# LinkedIn: one OR-combined query per city (5 search requests + pagination per run), with
# a 90s gap between cities. JobSpy's README: LinkedIn blocks around the 10th page per IP.
# Indeed has no practical rate limit, so it runs every term x city.
jobspy:
  - site: indeed
    results_wanted: 50
    hours_old: 24
    delay_seconds: 2
  - site: linkedin
    combine_terms: true
    results_wanted: 30
    hours_old: 24
    delay_seconds: 90
  # Off by default: no descriptions, blocks after ~30 requests, mostly duplicates Indeed.
  - site: glassdoor
    enabled: false
    combine_terms: true
    results_wanted: 30
    hours_old: 24
    delay_seconds: 30

jobbank_enabled: true
gcjobs_enabled: true

descriptions:
  linkedin_max_per_run: 25
  linkedin_delay_seconds: 10
  jobbank_max_per_run: 60

# Every job's title must contain one of these (case/accent-insensitive, whole word; trailing * = prefix).
# This is the main relevance filter: Indeed and Workday also match descriptions, so "food safety"
# otherwise pulls in every line cook with a food-handler certificate.
title_keywords: [microbiolog*, laborator*, lab, quality, QA, QC, FSQA, HACCP, food safety, food scien*,
                 food technolog*, food quality, food testing, molecular, environment*, analytical,
                 scientist*, research*, chemist*, biochem*, biolog*, biotech*, sample, samples, HPLC, assay*,
                 stability, sanitation, regulatory, validation, product develop*, R&D,
                 in vivo, OOS, GC, GCMS*, LCMS*, ICP*, spectro*, chromatograph*, SQF,
                 analyst*, assurance, sterility, QMS, technologist*, testing, GMP]

# Then dropped if the title contains any of these (same matching rules).
exclude_title_keywords: [software, SDET, tester, game, games, QA automation, test automation, web developer,
                         full stack, frontend, backend, devops, dental, IT, bilingue, French]

