[project]
name = "shigoto"
version = "0.1.0"
description = "Job aggregation, dedup, SQLite history and Google Sheets sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "gspread>=6.2.1",
    "pydantic>=2.13.5",
    "python-jobspy>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
shigoto = "shigoto:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["jobspy", "jobspy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
